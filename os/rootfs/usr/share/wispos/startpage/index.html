<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WispOS</title>
<style>
/* the desktop-mode palette (os/ui/wisp-ui.h) and type (Liberation Sans); big tiles for a pad that moves the focus with the D-pad */
:root { --bg: #0e141b; --panel: #23262e; --line: #3d4450; --text: #ffffff; --dim: #8b929a; --accent: #1a9fff; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 18px "Liberation Sans", Arial, sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 22px 16px 28px; }
h1 { font-size: 30px; margin: 0 0 4px; }
p.sub { margin: 0 0 18px; color: var(--dim); font-size: 15px; }
form { margin: 0 0 20px; }
input[type=search] { width: 100%; height: 52px; padding: 0 14px; border: 2px solid var(--line); border-radius: 2px; background: #000; color: var(--text); font: inherit; }
input[type=search]:focus, a.tile:focus { outline: 3px solid var(--accent); outline-offset: 1px; }
nav { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
a.tile { display: block; height: 72px; padding: 14px 12px; border-radius: 2px; background: var(--panel); color: var(--text); text-decoration: none; }
a.tile span { display: block; margin-top: 4px; color: var(--dim); font-size: 14px; }
a.tile:hover { background: var(--line); }
</style>
</head>
<body>
<main>
  <h1>WispOS</h1>
  <p class="sub">Search, or pick a tile. Downloads land in the Downloads folder and the desktop offers to install them.</p>
  <form action="https://duckduckgo.com/" method="get"><input type="search" name="q" placeholder="Search the web" aria-label="Search the web" autofocus></form>
  <nav>
    <a class="tile" href="https://duckduckgo.com/">DuckDuckGo<span>Search</span></a>
    <a class="tile" href="https://en.wikipedia.org/">Wikipedia<span>Read</span></a>
    <a class="tile" href="https://archive.org/">Internet Archive<span>Games and software</span></a>
    <a class="tile" href="https://github.com/">GitHub<span>Code</span></a>
    <a class="tile" href="https://store.steampowered.com/">Steam Store<span>Games</span></a>
    <a class="tile" href="https://www.gog.com/">GOG<span>Games</span></a>
    <a class="tile" href="https://itch.io/">itch.io<span>Games</span></a>
    <a class="tile" href="https://news.ycombinator.com/">Hacker News<span>News</span></a>
  </nav>
</main>
</body>
</html>
