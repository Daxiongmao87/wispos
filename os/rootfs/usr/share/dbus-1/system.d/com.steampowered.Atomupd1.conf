<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
        "https://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Who may own and call com.steampowered.Atomupd1. Anyone may send to it and read its properties; the daemon itself (sd-bus, no UNPRIVILEGED flag) refuses the methods that
     change anything (StartUpdate, Pause/Resume/Cancel, SwitchToVariant) to every caller that is not root. -->
<busconfig>
        <policy user="root">
                <allow own="com.steampowered.Atomupd1"/>
                <allow send_destination="com.steampowered.Atomupd1"/>
                <allow receive_sender="com.steampowered.Atomupd1"/>
        </policy>
        <policy context="default">
                <allow send_destination="com.steampowered.Atomupd1"/>
                <allow receive_sender="com.steampowered.Atomupd1"/>
        </policy>
</busconfig>
