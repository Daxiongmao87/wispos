# Home for the wisp user on persistent storage (the root filesystem is read-only).
d /storage/home 0755 root root -
d /storage/home/wisp 0700 wisp wisp -
# Where the session keeps its data: the Steam runtime, its home and the session logs.
d /storage/wispos 0755 root root -
d /storage/wispos/logs 0755 root root -
d /storage/wispos/home 0755 root root -
