# DEV BUILDS ONLY: the diagnostic tools live in the read-only image under /usr/lib/wispos-dev, but they write logs and scratch files next to themselves at
# /storage/wispos/dev, so that is a real directory on the card with the read-only tool folders linked into it.
d /storage/wispos/dev 0755 root root -
L /storage/wispos/dev/diag - - - - /usr/lib/wispos-dev/diag
L /storage/wispos/dev/kill-game.sh - - - - /usr/lib/wispos-dev/diag/kill-game.sh
L /storage/wispos/dev/gamelaunch.sh - - - - /usr/lib/wispos-dev/diag/gamelaunch.sh
L /storage/wispos/dev/replay_app.py - - - - /usr/lib/wispos-dev/diag/replay_app.py
L /storage/wispos/dev/wisp-dev-pad - - - - /usr/bin/wisp-dev-pad
